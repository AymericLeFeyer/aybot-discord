services:
  aybot:
    image: ghcr.io/aymericlefeyer/aybot-discord:latest
    container_name: aybot
    restart: unless-stopped
    init: true
    ports:
      - '${AYBOT_PORT:-3000}:3000'
    environment:
      POLL_INTERVAL_MINUTES: ${POLL_INTERVAL_MINUTES:-5}
    volumes:
      - aybot-data:/data
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

volumes:
  aybot-data:
